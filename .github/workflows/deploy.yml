name: deploy_nashikchakhabarnama.com

on:
    push:
        branches:
            - dev-ashwini

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Clone repo
              uses: actions/checkout@v4

            - name: Setup node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Build Project
              env:
                NEXT_PUBLIC_API_URL: https://api.nk.uttirna.in
              run: npm run build

            - name: Copy to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.HOST}}
                  username: ${{secrets.USER}}
                  key: ${{ secrets.PRIVATE_KEY}}
                  source: '.next'
                  target: '/var/www/nashik-khabarnama/web'
            - name: Restart server
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.HOST}}
                  username: ${{secrets.USER}}
                  key: ${{secrets.PRIVATE_KEY}}
                  script: |
                    . ~/.nvm/nvm.sh
                    cd /var/www/nashik-khabarnama/web
                    npm install
                    pm2 restart ecosystem.config.js --env production